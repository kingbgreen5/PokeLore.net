services:
  - type: web
    name: pokelore-net
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /pokemon/*
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /item/*
        name: Content-Type
        value: text/html; charset=utf-8
    routes:
      # Pokemon canonical and numeric URLs are exact extensionless static files
      # emitted by the production build. Keep Render routing minimal so missing
      # Pokemon URLs fall through to React's confirmed not-found/noindex path.
      - type: rewrite
        source: /pokemon/*
        destination: /index.html
      # Canonical item URLs are exact extensionless static files. Missing item
      # URLs receive a real neutral item shell instead of homepage metadata.
      - type: rewrite
        source: /item/*
        destination: /item-fallback.html
      - type: rewrite
        source: /*
        destination: /index.html
