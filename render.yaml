services:
  - type: web
    name: pokelore-net
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # These rules must also be applied to the live static site (Blueprint sync
    # or Dashboard > Headers). A code-only deploy does not sync service settings.
    # /location/, /pokemon/ and /item/ are document-only output namespaces.
    headers:
      - path: /location/*
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /pokemon/*
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /item/*
        name: Content-Type
        value: text/html; charset=utf-8
    routes:
      # Pokemon canonical and numeric URLs are exact extensionless static files
      # emitted by the production build. Keep Render routing minimal so missing
      # Pokemon URLs fall through to React's confirmed not-found/noindex path.
      - type: rewrite
        source: /pokemon/*
        destination: /index.html
      # Canonical item URLs are exact extensionless static files. Missing item
      # URLs receive a real neutral item shell instead of homepage metadata.
      - type: rewrite
        source: /item/*
        destination: /item-fallback.html
      # Valid location URLs are exact extensionless files, served before rewrites.
      # Unknown URLs receive neutral metadata until React confirms the lookup.
      - type: rewrite
        source: /location/*
        destination: /location-fallback.html
      - type: rewrite
        source: /*
        destination: /index.html
